name: Graphics against OF master

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 19 * * 1'

permissions:
  contents: read

concurrency:
  group: graphics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.master.outputs.sha }}
    steps:
      - name: Resolve openFrameworks master once for the whole matrix
        id: master
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api repos/openframeworks/openFrameworks/commits/master --jq .sha)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Testing openframeworks/openFrameworks@${sha}" >> "$GITHUB_STEP_SUMMARY"

  graphics:
    needs: upstream
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: Linux GL 2.1 / 3.2 / 3.3 / 4.1, runner: ubuntu-24.04, platform: linux}
          - {name: macOS app build, runner: macos-26, platform: macos}
          - {name: WebGL 1, runner: ubuntu-24.04, platform: web, webgl: '1'}
          - {name: WebGL 2, runner: ubuntu-24.04, platform: web, webgl: '2'}
          - {name: iOS ES 1.1 / 2.0 / 3.0, runner: macos-26, platform: ios}
          - {name: Android arm64 APK, runner: ubuntu-24.04, platform: android, abi: arm64-v8a}
          - {name: Android ES 1.1 / 2.0 / 3.0 / 3.1 / 3.2, runner: ubuntu-24.04, platform: android, abi: x86_64}
    env:
      OF_ROOT: ${{ github.workspace }}/openFrameworks
      APP_ROOT: ${{ github.workspace }}/openFrameworks/apps/ofGLMatrix
      OF_SHA: ${{ needs.upstream.outputs.sha }}
      CI_PLATFORM: ${{ matrix.platform }}
      MATRIX_NAME: ${{ matrix.name }}
      WEBGL: ${{ matrix.webgl }}
      ABI: ${{ matrix.abi }}
      NDK: '30.0.16248370'
      NUM_CORES: '2'
    defaults:
      run:
        shell: bash
        working-directory: openFrameworks/apps/ofGLMatrix
    steps:
      - name: Check out upstream master at the resolved commit
        uses: actions/checkout@v6
        with:
          repository: openframeworks/openFrameworks
          ref: ${{ needs.upstream.outputs.sha }}
          path: openFrameworks
          persist-credentials: false
      - name: Check out the test apps at the expected OF directory depth
        id: app
        uses: actions/checkout@v6
        with:
          path: openFrameworks/apps/ofGLMatrix
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: matrix.platform == 'web'
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Start iOS simulator migration during compilation
        if: matrix.platform == 'ios'
        continue-on-error: true
        run: python3 ci/simulator.py
      - name: Build OF master and the app
        id: build
        run: |
          mkdir -p artifacts
          echo "$OF_SHA" > artifacts/openFrameworks-sha.txt
          bash ci/build.sh 2>&1 | tee artifacts/build.log
      - name: Run desktop GL cases
        id: desktop
        if: matrix.platform == 'linux'
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 1280x1024x24' python3 ci/run.py desktop
      - name: Run WebGL in headless Chrome
        id: web
        if: matrix.platform == 'web'
        run: node ci/web.mjs
      - name: Run iOS simulator cases
        id: ios
        if: matrix.platform == 'ios'
        run: python3 ci/run.py ios
      - name: Enable KVM for the Android emulator
        if: matrix.abi == 'x86_64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android emulator cases
        id: android
        if: matrix.abi == 'x86_64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 "$APP_ROOT/ci/run.py" android
      - name: Write job result tables
        if: always() && steps.app.outcome == 'success'
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          RUNTIME_OUTCOME: ${{ steps.desktop.outcome == 'success' && 'success' || steps.web.outcome == 'success' && 'success' || steps.ios.outcome == 'success' && 'success' || steps.android.outcome == 'success' && 'success' || 'not successful' }}
        run: |
          python3 ci/summary.py job --build "$BUILD_OUTCOME" --runtime "$RUNTIME_OUTCOME"
      - name: Upload summary report
        if: always() && steps.app.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: report-${{ matrix.platform }}-${{ matrix.webgl || matrix.abi || 'native' }}
          path: openFrameworks/apps/ofGLMatrix/artifacts/report.json
          retention-days: 7
          if-no-files-found: error
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: graphics-${{ matrix.platform }}-${{ matrix.webgl || matrix.abi || 'native' }}
          path: openFrameworks/apps/ofGLMatrix/artifacts/
          retention-days: 7
          if-no-files-found: warn

  graphics-result:
    name: Graphics result
    needs: [upstream, graphics]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Download matrix summaries
        id: reports
        uses: actions/download-artifact@v8.0.2
        continue-on-error: true
        with:
          pattern: report-*
          path: reports
      - name: Write combined result tables
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OF_SHA: ${{ needs.upstream.outputs.sha }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" --jq '[.[].jobs[]]' > jobs.json
          mkdir -p reports
          python3 ci/summary.py aggregate --reports reports --jobs jobs.json
      - name: Require every matrix job to succeed
        if: always()
        env:
          UPSTREAM: ${{ needs.upstream.result }}
          GRAPHICS: ${{ needs.graphics.result }}
        run: test "$UPSTREAM" = success && test "$GRAPHICS" = success
